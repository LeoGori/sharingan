# ==================================================================================================================== #
#                                                EXPERIMENT CONFIGURATION                                              # 
# ==================================================================================================================== #


project:
    name: sharingan_custom_new # name of the wandb project
    version: 1.0.0
    description: Sharingan - Transformer architecture for multi-person gaze following.

# ------------------------------------------------------------------------------------------------------------------- #

experiment:
    name: training4people # name of the wandb job
    group: iit # name of the wandb group
    task: train+test # combination of {train, val, test} separated by '+' sign
    dataset: custom # gazefollow, videoattentiontarget, childplay
    path: ${hydra:runtime.cwd} # to retrieve logs and checkpoints

# ------------------------------------------------------------------------------------------------------------------- #

data:
    num_people: 1 # int or -1 to include all people
    return_head_mask: False
    image_size: 224
    heatmap_size: 64
    heatmap_sigma: 3
    stride: 1 # temporal stride for video datasets
    gf:
        root: </path/to>/gazefollow_extended
        root_annotations: </path/to/folder/with/annotations>
        root_heads: </path/to>/GazeFollow-head
        num_train_samples: 108955
    vat:
        root: </path/to>/VideoAttentionTarget
        root_heads: </path/to>/VideoAttentionTarget-head/images
        num_train_samples: 125837
    cp:
        root: </path/to>/ChildPlay
        root_heads: </path/to>/ChildPlay-head/images
        num_train_samples: 192220
    custom:
        root: 
        root_annotations: /home/icub/lgori/sharingan/data/
        use_bg_switch: True # background switch augmentation on the train split only (load frames_nobg and paste a background from bg_dir); val always loads the original frames
        use_bg_switch_test: False # background switch on the test split (frames_nobg + a fixed background per sample, deterministic across runs); False loads the original frames
        max_transparent_ratio: 0.8 # if the frames_nobg image has more than this fraction of fully transparent pixels (e.g. empty scene), the original frame is used instead
        bg_dir: /home/icub/lgori/sharingan/bg # backgrounds used to fill transparent pixels of RGBA images
        debug_bg_every_n: 0 # save the loaded image (with pasted background) every N calls to __getitem__; 0 disables it
        debug_bg_dir: /home/icub/lgori/sharingan/debug_bg_test1 # where debug images are saved (one subfolder per split)
        num_train_samples: 23259


# ------------------------------------------------------------------------------------------------------------------- #

model:
    sharingan:
        patch_size: 16
        token_dim: 768
        image_size: ${data.image_size}
        gaze_feature_dim: 512
        encoder_depth: 12
        encoder_num_heads: 12
        encoder_num_global_tokens: 0
        encoder_mlp_ratio: 4.0
        encoder_use_qkv_bias: True
        encoder_drop_rate: 0.0
        encoder_attn_drop_rate: 0.0
        encoder_drop_path_rate: 0.0
        decoder_feature_dim: 128
        decoder_hooks: [2, 5, 8, 11]
        decoder_hidden_dims: [48, 96, 192, 384]
        decoder_use_bn: True
    pretraining:
        gaze360: /home/icub/lgori/sharingan/weights/gaze360_resnet18.pt
        multivit: /home/icub/lgori/sharingan/weights/multimae-b_98_rgb+-depth-semseg_1600e_multivit-afff3f8c.pth
    weights: /home/icub/lgori/sharingan/checkpoints/videoattentiontarget.pt # /!\ null (default), or path to a checkpoint (overrides pretraining weights)

# ------------------------------------------------------------------------------------------------------------------- #

loss:
    weight_heatmap: 1000
    weight_angular: 0
    weight_bce: 10

# ------------------------------------------------------------------------------------------------------------------- #

optimizer:
    lr:
        base: 3e-5
        gaze_encoder: 0
        image_tokenizer: 0
        vit_encoder: 0
        gaze_decoder: 1e-6
        inout_decoder: 3e-4
    weight_decay: 1e-3 # /!\

# ------------------------------------------------------------------------------------------------------------------- #

scheduler:
    type: null # cosine_warmup (default), null (no scheduler)
    warmup_epochs: 0

# ------------------------------------------------------------------------------------------------------------------- #

train: 
    seed: 5
    matmul_precision: highest # highest (default), high, medium
    precision: 32 # 64 (double), 32 (full), 16 (16bit mixed), bf16-mixed (bfloat16 mixed). Defaults to 32.
    epochs: 5
    batch_size: 16
    accumulate_grad_batches: 1 # 1 (default, no accumulation)
    device: cuda
    resume: False
    resume_from: null
    checkpointing:
        monitor: "metric/val/dist" # "metric/val/dist" (default), "metric/val/ap", "loss/val"
        mode: "min" # "min" (default), "max"
    freeze:
        gaze_encoder: True
        image_tokenizer: True
        vit_encoder: True
        gaze_decoder: False
        inout_decoder: False
    swa:
        use: False
        lr: 3e-5
        epoch_start: 11
        annealing_epochs: 8

# ------------------------------------------------------------------------------------------------------------------- #

val: 
    checkpoint: null
    batch_size: 1
    device: ${train.device}

# ------------------------------------------------------------------------------------------------------------------- #

test:
    checkpoint: null
    batch_size: 1
    device: ${train.device}

# ------------------------------------------------------------------------------------------------------------------- #

wandb:
    log: True
    watch: null # /!\ null, gradients, parameters, all
    watch_freq: 500

# ------------------------------------------------------------------------------------------------------------------- #

hydra: 
    run: 
        dir: ./
    job: 
        chdir: True
